services:
  # ===================
  # Nginx Reverse Proxy
  # ===================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: perchspot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Certbot for SSL
  # ===================
  certbot:
    image: certbot/certbot:latest
    container_name: perchspot_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ===================
  # Database Services
  # ===================
  mysql:
    image: mysql:8.0
    container_name: perchspot_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: housing_analysis
      MYSQL_USER: housing_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: perchspot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===================
  # Storage Services
  # ===================
  minio:
    image: minio/minio
    container_name: perchspot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: perchspot_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================
  # Application Services
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perchspot_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: mysql+pymysql://housing_user:${MYSQL_PASSWORD}@mysql:3306/housing_analysis
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # S3/MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: housing-analysis
      # API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GREATSCHOOLS_API_KEY: ${GREATSCHOOLS_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      # Production Settings
      DEBUG: "False"
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      CORS_ORIGINS: https://${DOMAIN}
      # LLM
      ENABLE_PROPERTY_LLM_ANALYSIS: ${ENABLE_PROPERTY_LLM_ANALYSIS:-false}
      ANALYSIS_LLM_PROVIDER: ${ANALYSIS_LLM_PROVIDER:-gemini}
      # Security
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perchspot_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=1
    environment:
      DATABASE_URL: mysql+pymysql://housing_user:${MYSQL_PASSWORD}@mysql:3306/housing_analysis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: housing-analysis
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GREATSCHOOLS_API_KEY: ${GREATSCHOOLS_API_KEY:-}
      ENABLE_PROPERTY_LLM_ANALYSIS: ${ENABLE_PROPERTY_LLM_ANALYSIS:-false}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perchspot_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=warning
    environment:
      DATABASE_URL: mysql+pymysql://housing_user:${MYSQL_PASSWORD}@mysql:3306/housing_analysis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: housing-analysis
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GREATSCHOOLS_API_KEY: ${GREATSCHOOLS_API_KEY:-}
      ENABLE_PROPERTY_LLM_ANALYSIS: ${ENABLE_PROPERTY_LLM_ANALYSIS:-false}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Frontend build stage - builds static files and exits
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://${DOMAIN}
    container_name: perchspot_frontend_build
    volumes:
      - frontend_build:/app/dist

volumes:
  mysql_data:
  redis_data:
  minio_data:
  qdrant_data:
  frontend_build:
