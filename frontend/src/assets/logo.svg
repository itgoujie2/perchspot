<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E8432A"/>
    </linearGradient>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A4A"/>
      <stop offset="100%" stop-color="#1A2533"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E5068"/>
      <stop offset="100%" stop-color="#2D3A4A"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000022"/>
    </filter>
    <filter id="birdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Location Pin -->
  <g filter="url(#pinShadow)">
    <!-- Pin body -->
    <path d="M200 390 
             C200 390 120 280 120 210 
             C120 165 155 130 200 130 
             C245 130 280 165 280 210 
             C280 280 200 390 200 390Z" 
          fill="url(#pinGrad)"/>
    <!-- Pin inner circle (white) -->
    <circle cx="200" cy="208" r="38" fill="white" opacity="0.95"/>
    <!-- Pin inner circle (accent dot) -->
    <circle cx="200" cy="208" r="18" fill="url(#pinGrad)" opacity="0.7"/>
  </g>

  <!-- Bird perched on top of pin -->
  <g filter="url(#birdShadow)" transform="translate(200, 130)">
    <!-- Tail feathers -->
    <path d="M15 -8 Q40 -20 52 -5 Q42 -10 30 -5 Q45 -18 58 -12 Q42 -14 28 -2Z" 
          fill="url(#wingGrad)" opacity="0.85"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="-22" rx="28" ry="22" fill="url(#birdGrad)"/>
    
    <!-- Wing -->
    <path d="M-5 -30 Q20 -45 35 -25 Q25 -30 15 -22 Q22 -38 32 -30 Q18 -35 8 -18Z" 
          fill="url(#wingGrad)"/>
    
    <!-- Belly highlight -->
    <ellipse cx="-4" cy="-14" rx="14" ry="12" fill="#3E5068" opacity="0.5"/>
    
    <!-- Head -->
    <circle cx="-18" cy="-42" r="14" fill="url(#birdGrad)"/>
    
    <!-- Eye ring -->
    <circle cx="-22" cy="-44" r="5.5" fill="white"/>
    <!-- Eye pupil -->
    <circle cx="-23" cy="-44" r="3" fill="#1A2533"/>
    <!-- Eye highlight -->
    <circle cx="-24" cy="-45.5" r="1.2" fill="white"/>
    
    <!-- Beak -->
    <path d="M-32 -42 L-40 -39 L-32 -38Z" fill="#FFB74D"/>
    <path d="M-32 -40 L-39 -38 L-32 -38Z" fill="#F09830"/>
    
    <!-- Legs gripping the pin top -->
    <g stroke="#2D3A4A" stroke-width="2.2" fill="none" stroke-linecap="round">
      <!-- Left leg -->
      <path d="M-8 -2 L-10 8"/>
      <path d="M-14 8 L-10 8 L-6 8"/>
      <!-- Right leg -->
      <path d="M5 -2 L7 8"/>
      <path d="M3 8 L7 8 L11 8"/>
    </g>

    <!-- Chest feather detail -->
    <path d="M-10 -18 Q-4 -12 2 -18" stroke="#4A6180" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M-8 -14 Q-2 -8 4 -14" stroke="#4A6180" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- Text: PERCHSPOT -->
  <text x="200" y="440" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="38" font-weight="700" letter-spacing="5" fill="#2D3A4A">
    <tspan fill="#2D3A4A">PERCH</tspan><tspan fill="#E8432A">SPOT</tspan>
  </text>

  <!-- Subtle tagline line -->
  <line x1="130" y1="450" x2="270" y2="450" stroke="#E8432A" stroke-width="1.5" opacity="0.3"/>
</svg>
